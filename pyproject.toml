[project]
name = "gateway-prepagos"
version = "0.1.0"
description = "Gateway de recargas móviles de Skilamy hacia Valuetopup v2 (Prepaynation)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]>=3",
    "httpx",
    "phonenumbers",
    "cryptography",
    "typer",
]

[project.scripts]
gateway = "app.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"migrations/versions/**" = ["E501"]  # código generado por Alembic

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "sandbox: pruebas contra el sandbox real de Prepaynation (solo a mano)",
]
addopts = "-m 'not sandbox'"
